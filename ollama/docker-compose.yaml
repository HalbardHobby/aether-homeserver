---
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - $OLLAMA_DATA:/root/.ollama
    ports:
      - 11434:11434
    pull_policy: always
    tty: true
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
